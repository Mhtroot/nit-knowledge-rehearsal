# Installed as /etc/nginx/conf.d/00-common.conf (http context), loaded before default.conf.

server_tokens off;

# Per-client-IP limits for requests. Generous on purpose: a whole campus can share
# one public/NAT address. The app adds its own limits on login and registration.
limit_req_zone  $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# Strict-Transport-Security is only sent on HTTPS responses: an empty value
# makes nginx skip the header, so plain-HTTP deployments are unaffected.
map $scheme $hsts_header {
    https   "max-age=15552000; includeSubDomains";
    default "";
}

# WebSocket & keep-alive connection map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Gzip compression for static assets and API responses
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
