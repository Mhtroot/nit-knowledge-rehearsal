# HTTPS server configuration. Mounted over conf.d/default.conf by docker-compose.tls.yml.
# Expects ./certs/fullchain.pem and ./certs/privkey.pem (mounted at /etc/nginx/certs).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/locations.inc;
}
