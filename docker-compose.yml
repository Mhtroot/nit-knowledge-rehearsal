services:
  db:
    image: mariadb:11
    container_name: elm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-mydb}
      MYSQL_USER: ${DB_USER:-basebot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - elm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    env_file: 
      - .env
    environment:
      DATABASE_URL: mysql://${DB_USER:-basebot}:${DB_PASSWORD:-root}@db:3306/${DB_NAME:-mydb}
      PORT: 4567
    ports:
      - "127.0.0.1:4567:4567"
    volumes:
      - app_assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elm-network

  web:
    image: nginx:alpine
    container_name: elm-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/common.conf:/etc/nginx/conf.d/00-common.conf:ro
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - app
    networks:
      - elm-network

volumes:
  db_data:
  app_assets:

networks:
  elm-network:
    driver: bridge
