services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB:-service_base}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:1234"
    environment:
      DATABASE_URL: "mysql://${DB_USER:-root}:${DB_PASS:-root}@db:3306/${DB:-service_base}"
      PORT: 1234
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - app_assets:/app/assets
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_assets:
