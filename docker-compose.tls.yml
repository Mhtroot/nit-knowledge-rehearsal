# HTTPS overlay for production deployment.
# Put the certificate files in ./certs/ (fullchain.pem, privkey.pem),
# then enable HTTPS by setting this in .env:
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
#
# Then run: `docker compose up -d --build`

services:
  web:
    ports:
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
